<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 智能文娱票务系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.2.36/dist/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Microsoft YaHei', sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        /* 背景装饰圆 */
        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%; opacity: 0.12; pointer-events: none;
        }
        body::before {
            width: 500px; height: 500px; background: #fff;
            top: -150px; right: -100px;
        }
        body::after {
            width: 400px; height: 400px; background: #fff;
            bottom: -120px; left: -80px;
        }
        .register-card {
            width: 460px; background: #fff; border-radius: 16px;
            padding: 44px 44px 36px; box-shadow: 0 24px 80px rgba(0,0,0,0.18);
            position: relative; z-index: 1;
        }
        .register-logo {
            text-align: center; margin-bottom: 6px;
        }
        .register-logo .logo-icon {
            font-size: 48px; display: inline-block;
            animation: bounce 2s ease infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .register-title {
            text-align: center; font-size: 24px; font-weight: bold;
            color: #303133; margin-bottom: 6px;
        }
        .register-subtitle {
            text-align: center; font-size: 14px; color: #909399; margin-bottom: 32px;
        }
        .register-form .el-form-item { margin-bottom: 20px; }
        .register-form .el-input :deep(.el-input__wrapper) {
            border-radius: 8px;
        }
        .register-btn {
            width: 100%; height: 46px; font-size: 16px; letter-spacing: 4px;
            border-radius: 8px;
        }
        .register-footer {
            text-align: center; margin-top: 20px; font-size: 14px; color: #909399;
        }
        .register-footer a { color: #409eff; text-decoration: none; font-weight: 500; }
        .register-footer a:hover { text-decoration: underline; }
        /* 响应式 */
        @media (max-width: 480px) {
            .register-card { width: 92vw; padding: 36px 24px 28px; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="register-card">
        <div class="register-logo">
            <span class="logo-icon">🎫</span>
        </div>
        <div class="register-title">智能文娱票务系统</div>
        <div class="register-subtitle">创建账号，开启精彩之旅</div>
        <el-form class="register-form" :model="form" :rules="rules" ref="formRef" @submit.prevent="handleRegister">
            <el-form-item prop="username">
                <el-input v-model="form.username" placeholder="请输入用户名" :prefix-icon="User" size="large" clearable />
            </el-form-item>
            <el-form-item prop="password">
                <el-input v-model="form.password" type="password" placeholder="请输入密码"
                          :prefix-icon="Lock" show-password size="large" />
            </el-form-item>
            <el-form-item prop="confirmPassword">
                <el-input v-model="form.confirmPassword" type="password" placeholder="请确认密码"
                          :prefix-icon="Lock" show-password size="large" />
            </el-form-item>
            <el-form-item prop="phone">
                <el-input v-model="form.phone" placeholder="请输入手机号" :prefix-icon="Iphone" size="large" clearable />
            </el-form-item>
            <el-form-item>
                <el-button class="register-btn" type="primary" :loading="loading" @click="handleRegister">注 册</el-button>
            </el-form-item>
        </el-form>
        <div class="register-footer">
            已有账号？<a href="/page/login">立即登录</a>
        </div>
    </div>
</div>
<script src="https://unpkg.com/vue@3.3.13/dist/vue.global.js"></script>
<script src="https://unpkg.com/element-plus@2.2.36"></script>
<script src="https://unpkg.com/@element-plus/icons-vue@2.3.1"></script>
<script src="/js/common.js"></script>
<script>
const { createApp, ref, reactive, shallowRef } = Vue;
const app = createApp({
    setup() {
        const User = shallowRef(ElementPlusIconsVue.User);
        const Lock = shallowRef(ElementPlusIconsVue.Lock);
        const Iphone = shallowRef(ElementPlusIconsVue.Iphone);
        const formRef = ref(null);
        const loading = ref(false);
        const form = reactive({ username: '', password: '', confirmPassword: '', phone: '' });

        const validateConfirmPassword = (rule, value, callback) => {
            if (value !== form.password) {
                callback(new Error('两次输入密码不一致'));
            } else {
                callback();
            }
        };
        const validatePhone = (rule, value, callback) => {
            if (value && !/^1[3-9]\d{9}$/.test(value)) {
                callback(new Error('请输入正确的手机号'));
            } else {
                callback();
            }
        };

        const rules = {
            username: [
                { required: true, message: '请输入用户名', trigger: 'blur' },
                { min: 3, max: 20, message: '用户名长度为3-20个字符', trigger: 'blur' }
            ],
            password: [
                { required: true, message: '请输入密码', trigger: 'blur' },
                { min: 6, max: 20, message: '密码长度为6-20个字符', trigger: 'blur' }
            ],
            confirmPassword: [
                { required: true, message: '请确认密码', trigger: 'blur' },
                { validator: validateConfirmPassword, trigger: 'blur' }
            ],
            phone: [
                { required: true, message: '请输入手机号', trigger: 'blur' },
                { validator: validatePhone, trigger: 'blur' }
            ]
        };

        const handleRegister = async () => {
            const valid = await formRef.value.validate().catch(() => false);
            if (!valid) return;
            loading.value = true;
            try {
                await post('/user/register', { username: form.username, password: form.password, phone: form.phone });
                ElementPlus.ElMessage.success('注册成功，请登录');
                setTimeout(() => { window.location.href = '/page/login'; }, 1000);
            } catch (e) {
                ElementPlus.ElMessage.error(e.message || '注册失败');
            } finally {
                loading.value = false;
            }
        };

        return { User, Lock, Iphone, formRef, form, rules, loading, handleRegister };
    }
});
app.use(ElementPlus);
for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
    app.component(key, component);
}
app.mount('#app');
</script>
</body>
</html>
