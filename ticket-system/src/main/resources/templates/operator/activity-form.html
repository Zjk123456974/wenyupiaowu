<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营管理中心 - 活动表单</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.2.36/dist/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Microsoft YaHei', sans-serif; }
        .layout { display: flex; height: 100vh; }
        .sidebar {
            width: 220px; background: #304156; color: #fff; display: flex;
            flex-direction: column; flex-shrink: 0;
        }
        .sidebar-logo {
            height: 60px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-menu { flex: 1; padding-top: 10px; }
        .sidebar-menu .menu-item {
            display: flex; align-items: center; padding: 14px 24px; color: #bfcbd9;
            text-decoration: none; font-size: 14px; cursor: pointer; transition: all .3s;
        }
        .sidebar-menu .menu-item:hover,
        .sidebar-menu .menu-item.active { background: #263445; color: #409eff; }
        .sidebar-menu .menu-item .el-icon { margin-right: 10px; }
        .sidebar-footer {
            padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-footer .logout-btn {
            width: 100%; color: #bfcbd9; cursor: pointer; font-size: 14px;
            display: flex; align-items: center;
        }
        .sidebar-footer .logout-btn:hover { color: #f56c6c; }
        .main-content { flex: 1; background: #f0f2f5; padding: 24px; overflow-y: auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-header h2 { font-size: 20px; color: #303133; }
        .form-card {
            background: #fff; border-radius: 8px; padding: 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05); max-width: 800px;
        }
        .form-card .el-form-item { margin-bottom: 22px; }
    </style>
</head>
<body>
<div id="app" th:inline="none">
    <div class="layout">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-logo">运营管理中心</div>
            <div class="sidebar-menu">
                <a class="menu-item" href="/page/operator/dashboard">
                    <el-icon><DataBoard /></el-icon>仪表盘
                </a>
                <a class="menu-item active" href="/page/operator/activity">
                    <el-icon><Ticket /></el-icon>活动管理
                </a>
                <a class="menu-item" href="/page/operator/stats">
                    <el-icon><TrendCharts /></el-icon>数据统计
                </a>
            </div>
            <div class="sidebar-footer">
                <div class="logout-btn" style="margin-bottom: 12px;" v-if="userRole === 2" @click="switchToAdmin">
                    <el-icon><Setting /></el-icon> 管理员界面
                </div>
                <div class="logout-btn" style="margin-bottom: 12px;" @click="switchToUser">
                    <el-icon><User /></el-icon> 用户界面
                </div>
                <div class="logout-btn" @click="logout">
                    <el-icon><SwitchButton /></el-icon> 退出登录
                </div>
            </div>
        </div>
        <!-- 右侧内容 -->
        <div class="main-content">
            <div class="page-header">
                <h2>{{ isEdit ? '编辑活动' : '新增活动' }}</h2>
            </div>
            <div class="form-card">
                <el-form :model="form" :rules="rules" ref="formRef" label-width="120px">
                    <el-form-item label="活动名称" prop="name">
                        <el-input v-model="form.name" placeholder="请输入活动名称" />
                    </el-form-item>
                    <el-form-item label="分类" prop="categoryId">
                        <el-select v-model="form.categoryId" placeholder="请选择分类" style="width: 100%">
                            <el-option v-for="cat in categories" :key="cat.id" :label="cat.name" :value="cat.id" />
                        </el-select>
                    </el-form-item>
                    <el-form-item label="地点" prop="location">
                        <el-input v-model="form.location" placeholder="请输入活动地点" />
                    </el-form-item>
                    <el-form-item label="活动时间" prop="activityTime">
                        <el-date-picker v-model="form.activityTime" type="datetimerange"
                            range-separator="至" start-placeholder="开始时间" end-placeholder="结束时间"
                            style="width: 100%" value-format="YYYY-MM-DD HH:mm:ss" />
                    </el-form-item>
                    <el-form-item label="封面URL" prop="coverUrl">
                        <el-input v-model="form.coverUrl" placeholder="请输入封面图片URL" />
                    </el-form-item>
                    <el-form-item label="活动介绍" prop="description">
                        <el-input v-model="form.description" type="textarea" :rows="4" placeholder="请输入活动介绍" />
                    </el-form-item>
                    <el-form-item label="票务规则" prop="ticketRule">
                        <el-input v-model="form.ticketRule" placeholder="请输入票务规则" />
                    </el-form-item>
                    <el-form-item label="限购数量" prop="limitCount">
                        <el-input-number v-model="form.limitCount" :min="1" :max="100" />
                    </el-form-item>
                    <el-form-item label="总票数" prop="totalTickets">
                        <el-input-number v-model="form.totalTickets" :min="1" />
                    </el-form-item>
                    <el-form-item label="票价" prop="price">
                        <el-input-number v-model="form.price" :min="0" :precision="2" />
                    </el-form-item>
                    <el-form-item label="抢票时间" prop="rushTime">
                        <el-date-picker v-model="form.rushTime" type="datetimerange"
                            range-separator="至" start-placeholder="开始时间" end-placeholder="结束时间"
                            style="width: 100%" value-format="YYYY-MM-DD HH:mm:ss" />
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" @click="handleSubmit" :loading="submitting">提交</el-button>
                        <el-button @click="goBack">返回</el-button>
                    </el-form-item>
                </el-form>
            </div>
        </div>
    </div>
</div>
<script src="https://unpkg.com/vue@3.3.13/dist/vue.global.js"></script>
<script src="https://unpkg.com/element-plus@2.2.36"></script>
<script src="https://unpkg.com/@element-plus/icons-vue@2.3.1"></script>
<script src="/js/common.js"></script>
<script>
const { createApp, ref, onMounted, computed } = Vue;
const app = createApp({
    setup() {
        const formRef = ref(null);
        const categories = ref([]);
        const submitting = ref(false);
        const isEdit = ref(false);
        const editId = ref(null);

        const form = ref({
            name: '', categoryId: '', location: '', activityTime: null,
            coverUrl: '', description: '', ticketRule: '', limitCount: 1,
            totalTickets: 100, price: 0, rushTime: null
        });

        const rules = {
            name: [{ required: true, message: '请输入活动名称', trigger: 'blur' }],
            categoryId: [{ required: true, message: '请选择分类', trigger: 'change' }],
            location: [{ required: true, message: '请输入地点', trigger: 'blur' }],
            totalTickets: [{ required: true, message: '请输入总票数', trigger: 'blur' }],
            price: [{ required: true, message: '请输入票价', trigger: 'blur' }]
        };

        const loadCategories = async () => {
            try {
                const res = await get('/category/list');
                categories.value = res.data || [];
            } catch (e) { console.error(e); }
        };

        const loadActivity = async (id) => {
            try {
                const res = await get('/operator/activity/' + id);
                const data = res.data;
                form.value = {
                    name: data.name,
                    categoryId: data.categoryId,
                    location: data.location,
                    activityTime: data.startTime && data.endTime ? [data.startTime, data.endTime] : null,
                    coverUrl: data.coverUrl || '',
                    description: data.description || '',
                    ticketRule: data.ticketRule || '',
                    limitCount: data.limitCount || 1,
                    totalTickets: data.totalTickets || 100,
                    price: data.price || 0,
                    rushTime: data.rushStartTime && data.rushEndTime ? [data.rushStartTime, data.rushEndTime] : null
                };
            } catch (e) { console.error(e); }
        };

        const handleSubmit = async () => {
            try {
                await formRef.value.validate();
            } catch { return; }

            const payload = {
                ...form.value,
                startTime: form.value.activityTime ? form.value.activityTime[0] : null,
                endTime: form.value.activityTime ? form.value.activityTime[1] : null,
                rushStartTime: form.value.rushTime ? form.value.rushTime[0] : null,
                rushEndTime: form.value.rushTime ? form.value.rushTime[1] : null
            };
            delete payload.activityTime;
            delete payload.rushTime;

            submitting.value = true;
            try {
                if (isEdit.value) {
                    await put('/operator/activity/' + editId.value, payload);
                    ElMessage.success('修改成功');
                } else {
                    await post('/operator/activity', payload);
                    ElMessage.success('创建成功');
                }
                window.location.href = '/page/operator/activity';
            } catch (e) {
                console.error(e);
            } finally {
                submitting.value = false;
            }
        };

        const goBack = () => { window.location.href = '/page/operator/activity'; };

        const logout = () => {
            localStorage.removeItem('token');
            window.location.href = '/page/login';
        };

        const userRole = ref(() => {
            const user = getCurrentUser();
            return user?.role ?? 0;
        });
        const switchToAdmin = () => { window.location.href = '/page/admin/dashboard'; };
        const switchToUser = () => { window.location.href = '/page/user/center'; };

        onMounted(async () => {
            await loadCategories();
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (id) {
                isEdit.value = true;
                editId.value = id;
                await loadActivity(id);
            }
        });

        return { form, formRef, rules, categories, isEdit, submitting, handleSubmit, goBack, logout, userRole, switchToAdmin, switchToUser };
    }
});
app.use(ElementPlus);
for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
    app.component(key, component);
}
app.mount('#app');
</script>
</body>
</html>
