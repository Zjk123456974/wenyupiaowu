﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统管理中心 - 分类管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.2.36/dist/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Microsoft YaHei', sans-serif; }
        .layout { display: flex; height: 100vh; }
        .sidebar {
            width: 220px; background: #304156; color: #fff; display: flex;
            flex-direction: column; flex-shrink: 0;
        }
        .sidebar-logo {
            height: 60px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-menu { flex: 1; padding-top: 10px; overflow-y: auto; }
        .sidebar-menu .menu-item {
            display: flex; align-items: center; padding: 12px 24px; color: #bfcbd9;
            text-decoration: none; font-size: 14px; cursor: pointer; transition: all .3s;
        }
        .sidebar-menu .menu-item:hover,
        .sidebar-menu .menu-item.active { background: rgba(64,158,255,0.15); color: #409eff; }
        .sidebar-menu .menu-item .el-icon { margin-right: 10px; }
        .sidebar-footer {
            padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-footer .logout-btn {
            width: 100%; color: #bfcbd9; cursor: pointer; font-size: 14px;
            display: flex; align-items: center;
        }
        .sidebar-footer .logout-btn:hover { color: #f56c6c; }
        .main-content { flex: 1; background: #f0f2f5; padding: 24px; overflow-y: auto; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-header h2 { font-size: 20px; color: #303133; }
        .table-card {
            background: #fff; border-radius: 8px; padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
<div id="app" th:inline="none">
    <div class="layout">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-logo">系统管理中心</div>
            <div class="sidebar-menu">
                <a class="menu-item" href="/page/admin/dashboard">
                    <el-icon><DataBoard /></el-icon>数据概览
                </a>
                <a class="menu-item" href="/page/admin/users">
                    <el-icon><User /></el-icon>用户管理
                </a>
                <a class="menu-item" href="/page/admin/activities">
                    <el-icon><Ticket /></el-icon>活动管理
                </a>
                <a class="menu-item" href="/page/admin/orders">
                    <el-icon><List /></el-icon>订单管理
                </a>
                <a class="menu-item active" href="/page/admin/categories">
                    <el-icon><Menu /></el-icon>分类管理
                </a>
                <a class="menu-item" href="/page/admin/banners">
                    <el-icon><Picture /></el-icon>轮播图管理
                </a>
                <a class="menu-item" href="/page/admin/announcements">
                    <el-icon><Bell /></el-icon>公告管理
                </a>
                <a class="menu-item" href="/page/admin/stats">
                    <el-icon><TrendCharts /></el-icon>数据统计
                </a>
            </div>
            <div class="sidebar-footer">
                <div class="logout-btn" style="margin-bottom: 12px;" @click="switchToUser">
                    <el-icon><User /></el-icon> 用户界面
                </div>
                <div class="logout-btn" style="margin-bottom: 12px;" @click="switchToOperator">
                    <el-icon><Setting /></el-icon> 运营界面
                </div>
                <div class="logout-btn" @click="handleLogout">
                    <el-icon><SwitchButton /></el-icon> 退出登录
                </div>
            </div>
        </div>
        <!-- 右侧内容 -->
        <div class="main-content">
            <div class="page-header">
                <h2>分类管理</h2>
                <el-button type="primary" @click="showAdd">
                    <el-icon><Plus /></el-icon> 新增分类
                </el-button>
            </div>
            <div class="table-card">
                <el-table :data="categories" stripe style="width: 100%">
                    <el-table-column prop="id" label="ID" width="80" />
                    <el-table-column prop="name" label="分类名称" min-width="200" />
                    <el-table-column label="操作" width="160">
                        <template #default="{ row }">
                            <el-button size="small" @click="showEdit(row)">编辑</el-button>
                            <el-button size="small" type="danger" @click="handleDelete(row)">删除</el-button>
                        </template>
                    </el-table-column>
                </el-table>
            </div>

            <!-- 新增/编辑对话框 -->
            <el-dialog v-model="dialogVisible" :title="dialogForm.id ? '编辑分类' : '新增分类'" width="450px">
                <el-form :model="dialogForm" label-width="80px">
                    <el-form-item label="分类名称">
                        <el-input v-model="dialogForm.name" placeholder="请输入分类名称" />
                    </el-form-item>
                </el-form>
                <template #footer>
                    <el-button @click="dialogVisible = false">取消</el-button>
                    <el-button type="primary" @click="submitForm">确定</el-button>
                </template>
            </el-dialog>
        </div>
    </div>
</div>
<script src="https://unpkg.com/vue@3.3.13/dist/vue.global.js"></script>
<script src="https://unpkg.com/element-plus@2.2.36/dist/index.full.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.js"></script>
<script src="/js/common.js"></script>
<script>
const { createApp, ref, onMounted } = Vue;
const app = createApp({
    setup() {
        const categories = ref([]);
        const dialogVisible = ref(false);
        const dialogForm = ref({ id: null, name: '' });

        const loadData = async () => {
            try {
                const res = await get('/category/list');
                categories.value = res || [];
            } catch (e) { console.error(e); }
        };

        const showAdd = () => {
            dialogForm.value = { id: null, name: '' };
            dialogVisible.value = true;
        };

        const showEdit = (row) => {
            dialogForm.value = { id: row.id, name: row.name };
            dialogVisible.value = true;
        };

        const submitForm = async () => {
            if (!dialogForm.value.name.trim()) {
                ElementPlus.ElMessage.warning('请输入分类名称');
                return;
            }
            try {
                if (dialogForm.value.id) {
                    await put('/admin/category/' + dialogForm.value.id, { name: dialogForm.value.name });
                    ElementPlus.ElMessage.success('修改成功');
                } else {
                    await post('/admin/category', { name: dialogForm.value.name });
                    ElementPlus.ElMessage.success('新增成功');
                }
                dialogVisible.value = false;
                loadData();
            } catch (e) { console.error(e); }
        };

        const handleDelete = async (row) => {
            try {
                await ElementPlus.ElMessageBox.confirm('确定要删除该分类吗？', '警告', { type: 'warning' });
                await del('/admin/category/' + row.id);
                ElementPlus.ElMessage.success('已删除');
                loadData();
            } catch (e) {
                if (e !== 'cancel') console.error(e);
            }
        };

        const handleLogout = () => {
            localStorage.removeItem('token');
            window.location.href = '/page/login';
        };

        const switchToUser = () => { window.location.href = '/page/'; };
        const switchToOperator = () => { window.location.href = '/page/operator/dashboard'; };

        onMounted(() => { loadData(); });

        return {
            categories, dialogVisible, dialogForm,
            showAdd, showEdit, submitForm, handleDelete, handleLogout,
            switchToUser, switchToOperator
        };
    }
});
app.use(ElementPlus);
for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
    app.component(key, component);
}
app.mount('#app');
</script>
</body>
</html>
