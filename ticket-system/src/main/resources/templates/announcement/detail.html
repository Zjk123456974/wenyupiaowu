<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告详情</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.2.36/dist/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 20px 0; }
        .header-inner { max-width: 900px; margin: 0 auto; padding: 0 20px; }
        .header-title { font-size: 24px; font-weight: bold; }
        .nav-links { margin-top: 10px; }
        .nav-links a { color: rgba(255,255,255,0.8); text-decoration: none; margin-right: 20px; font-size: 14px; }
        .nav-links a:hover { color: #fff; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .detail-card { background: #fff; border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .detail-title { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .detail-meta { display: flex; justify-content: space-between; color: #999; font-size: 13px; margin-bottom: 25px; }
        .detail-content { line-height: 2; color: #555; font-size: 15px; white-space: pre-wrap; }
        .back-btn { margin-top: 30px; display: flex; justify-content: center; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <div class="header-inner">
            <div class="header-title">系统公告</div>
            <div class="nav-links">
                <a href="/page/">首页</a>
                <a href="/page/activity/list">活动浏览</a>
                <a href="/page/user/center">个人中心</a>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="detail-card">
            <div class="detail-title">{{ announcement.title }}</div>
            <div class="detail-meta">
                <span>发布时间：{{ formatTime(announcement.createTime) }}</span>
                <span v-if="announcement.isTop === 1" style="color: #f56c6c;">置顶公告</span>
            </div>
            <div class="detail-content">{{ announcement.content }}</div>
            <div class="back-btn">
                <el-button type="primary" @click="goBack">返回首页</el-button>
            </div>
        </div>
    </div>
</div>
<script src="https://unpkg.com/vue@3.3.13/dist/vue.global.js"></script>
<script src="https://unpkg.com/element-plus@2.2.36"></script>
<script src="/js/common.js"></script>
<script>
const { createApp, ref, onMounted } = Vue;
const app = createApp({
    setup() {
        const announcement = ref({ title: '', content: '', createTime: '', isTop: 0 });

        const loadDetail = async () => {
            const id = getQueryParam('id');
            if (!id) {
                window.location.href = '/page/';
                return;
            }
            try {
                announcement.value = await get('/announcement/detail/' + id);
            } catch (e) {
                console.error(e);
                window.location.href = '/page/';
            }
        };

        const goBack = () => { window.location.href = '/page/'; };

        onMounted(() => { loadDetail(); });

        return { announcement, goBack, formatTime };
    }
});
app.use(ElementPlus);
app.mount('#app');
</script>
</body>
</html>
