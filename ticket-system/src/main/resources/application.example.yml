server:
  port: 9090

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ticket_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 你的MySQL密码   # 本地开发密码，请勿提交真实密码
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 200
        max-idle: 50
        min-idle: 10
        max-wait: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ticket.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: 请替换为自定义JWT签名密钥   # 生产环境务必使用强随机值，勿使用默认值
  expiration: 86400000

order:
  timeout: 15

ticket:
  rate-limit:
    interval: 3
  qr:
    # 核销二维码 HMAC 签名密钥，生产环境请替换为强随机值
    secret: 请替换为自定义二维码签名密钥   # 生产环境务必使用强随机值
    # 二维码有效时长（分钟），过期后需刷新，降低截图冒用风险
    ttl-minutes: 10
